services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tasknodeofficial
      POSTGRES_PASSWORD: tasknodeofficial
      POSTGRES_DB: tasknodeofficial
    ports:
      - "${TASKNODE_POSTGRES_PORT:-5436}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknodeofficial -d tasknodeofficial"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.tasknodeofficial-dev
        required: false
    environment:
      PORT: "8080"
      NODE_ENV: development
      TASKNODE_ENV: development
      TASKNODE_APP_NAME: tasknodeofficial-local
      TASKNODE_PUBLIC_URL: http://localhost:5174
      VITE_SITE_ORIGIN: http://localhost:5174
      VITE_BUILD_ID: docker-dev
      VITE_DEBUG_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      TASKNODE_DEV_AUTH_ENABLED: "true"
      TASKNODE_STORE_PATH: /data/runtime-store.json
      TASKNODE_DATABASE_ENABLED: "true"
      DATABASE_URL: ${TASKNODE_DATABASE_URL:-postgres://tasknodeofficial:tasknodeofficial@db:5432/tasknodeofficial}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Current-balance node on this machine. It is intentionally not the
      # canonical historical pull endpoint.
      PFTL_WSS_URL: ${PFTL_WSS_URL:-wss://178.156.143.199:6005}
      PFTL_WSS_URL_FALLBACKS: ${PFTL_WSS_URL_FALLBACKS:-wss://ws.testnet.postfiat.org}
      PFTL_WSS_REJECT_UNAUTHORIZED: ${PFTL_WSS_REJECT_UNAUTHORIZED:-true}
      PFTL_RPC_URL: ${PFTL_RPC_URL:-http://178.156.143.199:5005}
      PFTL_RPC_URL_FALLBACKS: ${PFTL_RPC_URL_FALLBACKS:-https://rpc.testnet.postfiat.org}
      PFTL_RPC_API_KEY: ${PFTL_RPC_API_KEY:-}
      PFTL_HISTORY_WSS_URL: ${PFTL_HISTORY_WSS_URL:-wss://ws-archive.testnet.postfiat.org}
      PFTL_HISTORY_WSS_URL_FALLBACKS: ${PFTL_HISTORY_WSS_URL_FALLBACKS:-}
      PFTL_HISTORY_RPC_URL: ${PFTL_HISTORY_RPC_URL:-https://rpc.testnet.postfiat.org:5006/}
      PFTL_HISTORY_RPC_URL_FALLBACKS: ${PFTL_HISTORY_RPC_URL_FALLBACKS:-}
      PFTL_HISTORY_RPC_API_KEY: ${PFTL_HISTORY_RPC_API_KEY:-}
      PFTL_HISTORY_ACCOUNT_TX_LIMIT: ${PFTL_HISTORY_ACCOUNT_TX_LIMIT:-200}
      PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES: ${PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES:-8}
      PFT_BALANCE_CACHE_TTL_MS: ${PFT_BALANCE_CACHE_TTL_MS:-15000}
      PFT_BALANCE_TIMEOUT_MS: ${PFT_BALANCE_TIMEOUT_MS:-8000}
      CHAT_MODEL_FRONTIER_INSTANT: ${CHAT_MODEL_FRONTIER_INSTANT:-chat-latest}
      ETH_DEPOSIT_XPUB: ${ETH_DEPOSIT_XPUB:-}
      ETH_DEPOSIT_START_INDEX: ${ETH_DEPOSIT_START_INDEX:-1}
      ETH_DEPOSIT_RPC_URL: ${ETH_DEPOSIT_RPC_URL:-https://ethereum.publicnode.com}
      ETH_DEPOSIT_BALANCE_BLOCK_TAG: ${ETH_DEPOSIT_BALANCE_BLOCK_TAG:-latest}
      ETH_DEPOSIT_ETH_USD_PRICE: ${ETH_DEPOSIT_ETH_USD_PRICE:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - dev_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5174
    depends_on:
      - api
    environment:
      NODE_ENV: development
      TASKNODE_API_ORIGIN: http://api:8080
      VITE_SITE_ORIGIN: http://localhost:5174
      VITE_BUILD_ID: docker-dev
      VITE_DEBUG_MODE: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  api_node_modules:
  web_node_modules:
  dev_data:
  pg_data:
