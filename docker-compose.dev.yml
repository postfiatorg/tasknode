services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tasknodeofficial
      POSTGRES_PASSWORD: tasknodeofficial
      POSTGRES_DB: tasknodeofficial
    ports:
      - "${TASKNODE_POSTGRES_PORT:-5436}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknodeofficial -d tasknodeofficial"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.tasknodeofficial-dev
        required: false
    environment:
      PORT: "8080"
      NODE_ENV: development
      TASKNODE_ENV: development
      TASKNODE_PROCESS_ROLE: web
      TASKNODE_APP_NAME: tasknodeofficial-local
      TASKNODE_PUBLIC_URL: http://localhost:5174
      VITE_SITE_ORIGIN: http://localhost:5174
      VITE_BUILD_ID: docker-dev
      VITE_DEBUG_MODE: "true"
      VITE_ANALYTICS_ENABLED: "false"
      TASKNODE_DEV_AUTH_ENABLED: "true"
      TASKNODE_STORE_PATH: /data/runtime-store.json
      TASKNODE_DATABASE_ENABLED: "true"
      DATABASE_URL: ${TASKNODE_DATABASE_URL:-postgres://tasknodeofficial:tasknodeofficial@db:5432/tasknodeofficial}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Current-balance node on this machine. It is intentionally not the
      # canonical historical pull endpoint.
      PFTL_WSS_URL: ${PFTL_WSS_URL:-wss://172.17.0.1:6005}
      PFTL_WSS_URL_FALLBACKS: ${PFTL_WSS_URL_FALLBACKS:-wss://ws.testnet.postfiat.org}
      PFTL_WSS_REJECT_UNAUTHORIZED: ${PFTL_WSS_REJECT_UNAUTHORIZED:-false}
      TASKNODE_ALLOW_INSECURE_LOCAL_PFTL_TLS: ${TASKNODE_ALLOW_INSECURE_LOCAL_PFTL_TLS:-true}
      PFTL_RPC_URL: ${PFTL_RPC_URL:-http://178.156.143.199:5005}
      PFTL_RPC_URL_FALLBACKS: ${PFTL_RPC_URL_FALLBACKS:-https://rpc.testnet.postfiat.org}
      PFTL_RPC_API_KEY: ${PFTL_RPC_API_KEY:-}
      PFTL_HISTORY_WSS_URL: ${PFTL_HISTORY_WSS_URL:-wss://ws-archive.testnet.postfiat.org}
      PFTL_HISTORY_WSS_URL_FALLBACKS: ${PFTL_HISTORY_WSS_URL_FALLBACKS:-}
      PFTL_HISTORY_RPC_URL: ${PFTL_HISTORY_RPC_URL:-https://rpc.testnet.postfiat.org:5006/}
      PFTL_HISTORY_RPC_URL_FALLBACKS: ${PFTL_HISTORY_RPC_URL_FALLBACKS:-}
      PFTL_HISTORY_RPC_API_KEY: ${PFTL_HISTORY_RPC_API_KEY:-}
      PFTL_HISTORY_ACCOUNT_TX_LIMIT: ${PFTL_HISTORY_ACCOUNT_TX_LIMIT:-200}
      PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES: ${PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES:-8}
      PFTL_CACHE_WSS_WATCHER_ENABLED: ${PFTL_CACHE_WSS_WATCHER_ENABLED:-true}
      PFTL_CACHE_WORKER_ENABLED: ${PFTL_CACHE_WORKER_ENABLED:-true}
      PFTL_CACHE_REDUCER_WORKER_ENABLED: ${PFTL_CACHE_REDUCER_WORKER_ENABLED:-true}
      PFTL_CACHE_ARCHIVE_WORKER_ENABLED: ${PFTL_CACHE_ARCHIVE_WORKER_ENABLED:-true}
      PFTL_CACHE_ARCHIVE_WORKER_INTERVAL_MS: ${PFTL_CACHE_ARCHIVE_WORKER_INTERVAL_MS:-300000}
      PFTL_CACHE_ARCHIVE_BATCH_LIMIT: ${PFTL_CACHE_ARCHIVE_BATCH_LIMIT:-1}
      PFTL_CACHE_ARCHIVE_MAX_PAGES: ${PFTL_CACHE_ARCHIVE_MAX_PAGES:-1}
      PFTL_CACHE_RETENTION_WORKER_ENABLED: ${PFTL_CACHE_RETENTION_WORKER_ENABLED:-true}
      PFTL_CACHE_RETENTION_COMPLETED_REDUCER_DAYS: ${PFTL_CACHE_RETENTION_COMPLETED_REDUCER_DAYS:-14}
      PFTL_CACHE_RETENTION_RAW_TX_ENABLED: ${PFTL_CACHE_RETENTION_RAW_TX_ENABLED:-false}
      TASKNODE_TASK_GENERATION_WORKER_ENABLED: ${TASKNODE_TASK_GENERATION_WORKER_ENABLED:-true}
      TASKNODE_TASK_GENERATION_WORKER_INTERVAL_MS: ${TASKNODE_TASK_GENERATION_WORKER_INTERVAL_MS:-5000}
      TASKNODE_NETWORK_TASK_GENERATION_WORKER_ENABLED: ${TASKNODE_NETWORK_TASK_GENERATION_WORKER_ENABLED:-true}
      TASKNODE_NETWORK_TASK_GENERATION_WORKER_INTERVAL_MS: ${TASKNODE_NETWORK_TASK_GENERATION_WORKER_INTERVAL_MS:-5000}
      TASKNODE_NETWORK_TASK_GENERATION_WORKER_BATCH_LIMIT: ${TASKNODE_NETWORK_TASK_GENERATION_WORKER_BATCH_LIMIT:-1}
      TASKNODE_TASK_REVIEW_WORKER_ENABLED: "false"
      TASKNODE_TASK_REVIEW_WORKER_INTERVAL_MS: ${TASKNODE_TASK_REVIEW_WORKER_INTERVAL_MS:-20000}
      TASKNODE_TASK_WORKER_CLAIM_STALE_SECONDS: ${TASKNODE_TASK_WORKER_CLAIM_STALE_SECONDS:-900}
      TASKNODE_DAILY_AIRDROP_WORKER_ENABLED: ${TASKNODE_DAILY_AIRDROP_WORKER_ENABLED:-true}
      TASKNODE_DAILY_AIRDROP_WORKER_RUN_MODE: ${TASKNODE_DAILY_AIRDROP_WORKER_RUN_MODE:-production}
      TASKNODE_DAILY_AIRDROP_AUTO_ISSUE: ${TASKNODE_DAILY_AIRDROP_AUTO_ISSUE:-true}
      TASKNODE_DAILY_AIRDROP_WORKER_INTERVAL_MS: ${TASKNODE_DAILY_AIRDROP_WORKER_INTERVAL_MS:-3600000}
      TASKNODE_DAILY_AIRDROP_INITIAL_DELAY_MS: ${TASKNODE_DAILY_AIRDROP_INITIAL_DELAY_MS:-30000}
      TASKNODE_DAILY_AIRDROP_WORKER_BATCH_LIMIT: ${TASKNODE_DAILY_AIRDROP_WORKER_BATCH_LIMIT:-10}
      PFT_BALANCE_CACHE_TTL_MS: ${PFT_BALANCE_CACHE_TTL_MS:-15000}
      PFT_BALANCE_TIMEOUT_MS: ${PFT_BALANCE_TIMEOUT_MS:-8000}
      CHAT_MODEL_FRONTIER_INSTANT: ${CHAT_MODEL_FRONTIER_INSTANT:-chat-latest}
      TASKNODE_TASKGEN_MODEL: ${TASKNODE_TASKGEN_MODEL:-chat-latest}
      TASKNODE_TASK_REVIEW_MODEL: ${TASKNODE_TASK_REVIEW_MODEL:-chat-latest}
      ETH_DEPOSIT_XPUB: ${ETH_DEPOSIT_XPUB:-}
      ETH_DEPOSIT_START_INDEX: ${ETH_DEPOSIT_START_INDEX:-1}
      ETH_DEPOSIT_RPC_URL: ${ETH_DEPOSIT_RPC_URL:-https://ethereum.publicnode.com}
      ETH_DEPOSIT_BALANCE_BLOCK_TAG: ${ETH_DEPOSIT_BALANCE_BLOCK_TAG:-latest}
      ETH_DEPOSIT_ETH_USD_PRICE: ${ETH_DEPOSIT_ETH_USD_PRICE:-}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - dev_data:/data

  board-manager:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run board-manager:worker -- --execute
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.tasknodeofficial-dev
        required: false
    environment:
      NODE_ENV: development
      TASKNODE_ENV: development
      TASKNODE_APP_NAME: tasknodeofficial-local-board-manager
      TASKNODE_PROCESS_ROLE: board-manager
      TASKNODE_BOARD_MANAGER_ENABLED: "true"
      TASKNODE_DATABASE_ENABLED: "true"
      DATABASE_URL: ${TASKNODE_DATABASE_URL:-postgres://tasknodeofficial:tasknodeofficial@db:5432/tasknodeofficial}
      HOME: /tmp/tasknode-board-manager-home
      TASKNODE_PUBLIC_URL: http://localhost:5174
      VITE_SITE_ORIGIN: http://localhost:5174
      TASKNODE_BOARD_MANAGER_WORKER_POLL_MS: ${TASKNODE_BOARD_MANAGER_WORKER_POLL_MS:-15000}
      TASKNODE_BOARD_MANAGER_CADENCE_SECONDS: ${TASKNODE_BOARD_MANAGER_CADENCE_SECONDS:-120}
      TASKNODE_BOARD_MANAGER_ACTION_DELAY_MS: ${TASKNODE_BOARD_MANAGER_ACTION_DELAY_MS:-5000}
      TASKNODE_BOARD_MANAGER_ERROR_DELAY_MS: ${TASKNODE_BOARD_MANAGER_ERROR_DELAY_MS:-300000}
      TASKNODE_BOARD_MANAGER_MAX_ACTIONS_PER_HOUR: ${TASKNODE_BOARD_MANAGER_MAX_ACTIONS_PER_HOUR:-60}
      TASKNODE_BOARD_MANAGER_STALE_JOB_SECONDS: ${TASKNODE_BOARD_MANAGER_STALE_JOB_SECONDS:-900}
      TASKNODE_BOARD_MANAGER_PROVIDER: ${TASKNODE_BOARD_MANAGER_PROVIDER:-openrouter}
      TASKNODE_BOARD_MANAGER_MODEL: ${TASKNODE_BOARD_MANAGER_MODEL:-qwen/qwen3.7-max}
      TASKNODE_BOARD_MANAGER_REASONING_EFFORT: ${TASKNODE_BOARD_MANAGER_REASONING_EFFORT:-high}
    user: "${TASKNODE_DOCKER_UID:-1001}:${TASKNODE_DOCKER_GID:-1001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - board_manager_node_modules:/app/node_modules
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5174
    depends_on:
      - api
    environment:
      NODE_ENV: development
      TASKNODE_API_ORIGIN: http://api:8080
      VITE_SITE_ORIGIN: http://localhost:5174
      VITE_BUILD_ID: docker-dev
      VITE_DEBUG_MODE: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  api_node_modules:
  board_manager_node_modules:
  web_node_modules:
  dev_data:
  pg_data:
