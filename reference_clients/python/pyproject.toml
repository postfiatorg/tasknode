[project]
name = "tasknode-pftl-reference"
version = "0.1.0"
description = "PFTL-native Task Node reference client and replay harness"
requires-python = ">=3.11"
dependencies = [
  "xrpl-py",
  "requests",
  "PyNaCl",
  "base58",
  "cryptography",
  "mnemonic",
  "Pillow",
  "pypdf",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tasknode_pftl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
