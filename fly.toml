app = "tasknodeofficial-dev"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "npm run start:web"
  worker = "npm run start:worker"
  board-manager = "npm run start:board-manager"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TASKNODE_ENV = "production"
  TASKNODE_DEV_AUTH_ENABLED = "false"
  TASKNODE_DATABASE_ENABLED = "true"
  TASKNODE_APP_NAME = "tasknodeofficial-dev"
  TASKNODE_PUBLIC_URL = "https://tasknodeofficial-dev.fly.dev"
  VITE_SITE_ORIGIN = "https://tasknodeofficial-dev.fly.dev"
  TELEGRAM_AUTH_WIDGET_DOMAIN = "tasknodeofficial-dev.fly.dev"
  DISCORD_REDIRECT_URI = "https://tasknodeofficial-dev.fly.dev/api/auth/callback/discord"
  TASKNODE_STORE_PATH = "/data/runtime-store.json"
  TASKNODE_RUNTIME_STORE_DURABLE = "true"
  VITE_BUILD_ID = "dev"
  VITE_DEBUG_MODE = "true"
  VITE_PFTL_EXPLORER_URL = "https://explorer.testnet.postfiat.org"
  VITE_PFTL_WSS_URL = "wss://ws.testnet.postfiat.org"
  PFTL_WSS_URL = "wss://ws.testnet.postfiat.org"
  PFTL_RPC_URL = "https://rpc.testnet.postfiat.org"
  PFTL_HISTORY_WSS_URL = "wss://ws-archive.testnet.postfiat.org"
  PFTL_HISTORY_RPC_URL = "https://rpc.testnet.postfiat.org:5006/"
  PFTL_HISTORY_ACCOUNT_TX_LIMIT = "200"
  PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES = "8"
  PFTL_CACHE_WSS_WATCHER_ENABLED = "true"
  PFTL_CACHE_WORKER_ENABLED = "true"
  PFTL_CACHE_REDUCER_WORKER_ENABLED = "true"
  PFTL_CACHE_ARCHIVE_WORKER_ENABLED = "true"
  PFTL_CACHE_ARCHIVE_WORKER_INTERVAL_MS = "300000"
  PFTL_CACHE_ARCHIVE_BATCH_LIMIT = "1"
  PFTL_CACHE_ARCHIVE_MAX_PAGES = "1"
  PFTL_CACHE_RETENTION_WORKER_ENABLED = "true"
  PFTL_CACHE_RETENTION_COMPLETED_REDUCER_DAYS = "14"
  PFTL_CACHE_RETENTION_RAW_TX_ENABLED = "false"
  PFT_BALANCE_CACHE_TTL_MS = "15000"
  PFT_BALANCE_TIMEOUT_MS = "8000"
  VITE_ANALYTICS_ENABLED = "true"
  VITE_ANALYTICS_DEBUG = "true"
  VITE_POSTHOG_HOST = "https://traffic.postfiat.org"
  VITE_POSTHOG_UI_HOST = "https://us.posthog.com"
  VITE_POSTHOG_REPLAY_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "tasknodeofficial_data"
  destination = "/data"
  processes = ["app"]
