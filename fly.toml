app = "tasknodeofficial-dev"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "npm run start:web"
  worker-pftl = "npm run start:worker:pftl"
  worker-taskgen = "npm run start:worker:taskgen"
  worker-task-review = "npm run start:worker:task-review"
  worker-context-rewrite = "npm run start:worker:context-rewrite"
  worker-hive = "npm run start:worker:hive"
  worker-memory-profile = "npm run start:worker:memory-profile"
  worker-airdrop = "npm run start:worker:airdrop"
  board-secretary = "npm run start:board-secretary"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TASKNODE_ENV = "production"
  TASKNODE_DEV_AUTH_ENABLED = "false"
  TASKNODE_DATABASE_ENABLED = "true"
  TASKNODE_APP_NAME = "tasknodeofficial-dev"
  TASKNODE_PUBLIC_URL = "https://tasknode.postfiat.org"
  VITE_SITE_ORIGIN = "https://tasknode.postfiat.org"
  TELEGRAM_AUTH_WIDGET_DOMAIN = "tasknode.postfiat.org"
  DISCORD_REDIRECT_URI = "https://tasknode.postfiat.org/api/auth/discord/callback"
  X_REDIRECT_URI = "https://tasknodeofficial-dev.fly.dev/api/auth/callback/x"
  GITHUB_REDIRECT_URI = "https://tasknodeofficial-dev.fly.dev/api/auth/callback/github"
  TASKNODE_LEGACY_REDIRECT_HOSTS = "tasknodeofficial-dev.fly.dev"
  TASKNODE_STORE_PATH = "/data/runtime-store.json"
  TASKNODE_RUNTIME_STORE_DURABLE = "true"
  VITE_BUILD_ID = "prod"
  VITE_DEBUG_MODE = "false"
  VITE_PFTL_EXPLORER_URL = "https://explorer.testnet.postfiat.org"
  VITE_PFTL_WSS_URL = "wss://ws.testnet.postfiat.org"
  PFTL_WSS_URL = "wss://ws.testnet.postfiat.org"
  PFTL_RPC_URL = "https://rpc.testnet.postfiat.org"
  PFTL_HISTORY_WSS_URL = "wss://ws-archive.testnet.postfiat.org"
  PFTL_HISTORY_RPC_URL = "https://rpc.testnet.postfiat.org:5006/"
  PFTL_HISTORY_ACCOUNT_TX_LIMIT = "200"
  PFTL_HISTORY_ACCOUNT_TX_MAX_PAGES = "8"
  PFTL_CACHE_WSS_WATCHER_ENABLED = "true"
  PFTL_CACHE_WORKER_ENABLED = "true"
  PFTL_CACHE_REDUCER_WORKER_ENABLED = "true"
  PFTL_CACHE_ARCHIVE_WORKER_ENABLED = "true"
  PFTL_CACHE_ARCHIVE_WORKER_INTERVAL_MS = "300000"
  PFTL_CACHE_ARCHIVE_BATCH_LIMIT = "1"
  PFTL_CACHE_ARCHIVE_MAX_PAGES = "1"
  PFTL_CACHE_RETENTION_WORKER_ENABLED = "true"
  PFTL_CACHE_RETENTION_COMPLETED_REDUCER_DAYS = "14"
  PFTL_CACHE_RETENTION_RAW_TX_ENABLED = "false"
  TASKNODE_OFFCHAIN_TASK_LIFECYCLE = "true"
  TASKNODE_OFFCHAIN_TASK_LIFECYCLE_DUAL_WRITE = "false"
  TASKNODE_TASK_POINTER_REDUCER_ENABLED = "false"
  TASKNODE_TASK_GENERATION_WORKER_ENABLED = "true"
  TASKNODE_TASK_GENERATION_WORKER_INTERVAL_MS = "5000"
  TASKNODE_TASK_GENERATION_WORKER_BATCH_LIMIT = "1"
  TASKNODE_NETWORK_TASK_GENERATION_WORKER_ENABLED = "true"
  TASKNODE_NETWORK_TASK_GENERATION_WORKER_INTERVAL_MS = "5000"
  TASKNODE_NETWORK_TASK_GENERATION_WORKER_BATCH_LIMIT = "1"
  TASKNODE_NETWORK_TASK_GENERATION_V2_ENABLED = "true"
  TASKNODE_HIVE_TASK_GENERATION_PROVIDER = "openai"
  TASKNODE_HIVE_TASK_GENERATION_MODEL = "gpt-5.6-sol"
  TASKNODE_HIVE_TASK_GENERATION_REASONING_EFFORT = "xhigh"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_ENABLED = "false"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_INTERVAL_MS = "60000"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_BATCH_LIMIT = "3"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_CONCURRENCY = "1"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_ENQUEUE_LIMIT = "3"
  TASKNODE_TASK_ACCOUNTING_HARVESTER_MODEL = "deepseek/deepseek-v4-pro"
  TASKNODE_HIVE_DECISION_AGENT_ENABLED = "false"
  TASKNODE_HIVE_DECISION_AGENT_ACTIVE = "false"
  TASKNODE_HIVE_TASK_MANAGER_ENABLED = "true"
  TASKNODE_HIVE_TASK_MANAGER_ACTIVE = "true"
  TASKNODE_HIVE_TASK_MANAGER_CADENCE_SECONDS = "300"
  TASKNODE_HIVE_TASK_MANAGER_MODEL = "z-ai/glm-5.2"
  TASKNODE_HIVE_TASK_MANAGER_REASONING_EFFORT = "high"
  TASKNODE_BOARD_MANAGER_ENABLED = "false"
  TASKNODE_BOARD_MANAGER_EXECUTION_ENABLED = "false"
  TASKNODE_LEGACY_BOARD_MANAGER_ENABLED = "false"
  TASKNODE_BOARD_MANAGER_CADENCE_SECONDS = "300"
  TASKNODE_BOARD_MANAGER_MAX_ACTIONS_PER_HOUR = "60"
  TASKNODE_HIVE_BOARD_SECRETARY_ENABLED = "true"
  TASKNODE_HIVE_BOARD_SECRETARY_MODEL = "z-ai/glm-5.2"
  TASKNODE_HIVE_BOARD_SECRETARY_CADENCE_SECONDS = "900"
  TASKNODE_HIVE_BOARD_SECRETARY_PROJECT_LIMIT = "100"
  TASKNODE_HIVE_BOARD_SECRETARY_DB_STATEMENT_TIMEOUT_MS = "60000"
  TASKNODE_TASK_REVIEW_WORKER_ENABLED = "true"
  TASKNODE_TASK_REVIEW_WORKER_INTERVAL_MS = "5000"
  TASKNODE_TASK_REVIEW_WORKER_BATCH_LIMIT = "1"
  TASKNODE_TASK_WORKER_CLAIM_STALE_SECONDS = "900"
  TASKNODE_DAILY_AIRDROP_WORKER_ENABLED = "true"
  TASKNODE_DAILY_AIRDROP_WORKER_RUN_MODE = "production"
  TASKNODE_PROFILE_NFT_DAILY_WORKER_ENABLED = "true"
  TASKNODE_PROFILE_NFT_DAILY_BATCH_LIMIT = "3"
  TASKNODE_PROFILE_NFT_DAILY_INTERVAL_MS = "600000"
  TASKNODE_PROFILE_NFT_DAILY_MAX_ATTEMPTS = "3"
  TASKNODE_PROFILE_NFT_DAILY_STALE_RUNNING_MS = "600000"
  PFT_BALANCE_CACHE_TTL_MS = "15000"
  PFT_BALANCE_TIMEOUT_MS = "8000"
  APP_STATE_CACHE_TTL_MS = "15000"
  VITE_ANALYTICS_ENABLED = "true"
  VITE_ANALYTICS_DEBUG = "false"
  VITE_POSTHOG_HOST = "https://traffic.postfiat.org"
  VITE_POSTHOG_UI_HOST = "https://us.posthog.com"
  VITE_POSTHOG_REPLAY_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 120
    soft_limit = 90

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "tasknodeofficial_data"
  destination = "/data"
  processes = ["app"]
